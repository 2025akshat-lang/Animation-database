<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Geometric Warli Art</title>
    <style>
        body {
            background-color: #f1dfc4; /* Mud plaster canvas simulation */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        svg {
            max-width: 100%;
            height: auto;
            background-color: #3d2217; /* Traditional geru (red-brown) background */
            box-shadow: 0 12px 35px rgba(0,0,0,0.4);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 1000 700" width="1000" height="700" xmlns="http://w3.org">
        
        <!-- ================= DEFINITIONS & REUSABLE ASSETS ================= -->
        <defs>
            <!-- Basic Warli Dancer Profile -->
            <g id="dancer">
                <!-- Head -->
                <circle cx="0" cy="-28" r="6" />
                <!-- Body: Upper and Lower Intersecting Triangles -->
                <polygon points="0,-22 -10,0 10,0" />
                <polygon points="0,11 -10,-1 10,-1" />
                <!-- Left Leg (Running/Dancing Stance) -->
                <path d="M -4 10 L -12 24 L -20 22" fill="none" stroke-width="2.5" />
                <!-- Right Leg -->
                <path d="M 4 10 L 4 26 L 12 28" fill="none" stroke-width="2.5" />
            </g>

            <!-- Complex Border Element (Repeating Triangle Mesh) -->
            <pattern id="triangle-border-top" x="0" y="0" width="40" height="25" patternUnits="userSpaceOnUse">
                <path d="M 0 25 L 20 0 L 40 25 Z M 20 0 L 20 25" fill="none" stroke="#f1dfc4" stroke-width="1.5"/>
                <circle cx="20" cy="16" r="2" fill="#f1dfc4"/>
            </pattern>
        </defs>

        <!-- ================= COMPLEX GEOMETRIC BORDERS ================= -->
        <!-- Outer Concentric Framework -->
        <rect x="15" y="15" width="970" height="670" fill="none" stroke="#f1dfc4" stroke-width="3" />
        <rect x="25" y="25" width="950" height="650" fill="none" stroke="#f1dfc4" stroke-width="1" stroke-dasharray="8,5" />
        
        <!-- Geometric Grid Border Accents using Pattern fills -->
        <rect x="35" y="35" width="930" height="20" fill="url(#triangle-border-top)" />
        <rect x="35" y="645" width="930" height="20" fill="url(#triangle-border-top)" transform="rotate(180 500 655)" />

        <!-- ================= MAIN CANVAS GLOBAL STYLING ================= -->
        <g fill="#f1dfc4" stroke="#f1dfc4" stroke-linecap="round" stroke-linejoin="round">

            <!-- ================= COMPONENT 1: THE FRACTAL TREE OF LIFE (Left) ================= -->
            <!-- Built entirely from structured geometric branches and triangular foliage packs -->
            <g transform="translate(220, 360)">
                <!-- Main Trunk -->
                <path d="M -15 240 L -4 120 L 0 0 L 4 120 L 15 240 Z" />
                <!-- Roots system in geometric lines -->
                <path d="M -12 235 L -45 270 L -65 265 M -5 238 L -15 275 L -10 290 M 8 237 L 35 272 L 55 280" fill="none" stroke-width="4"/>
                
                <!-- Level 1 Primary Geometric Branches -->
                <path d="M 0 100 Q -60 70 -100 20" fill="none" stroke-width="5" />
                <path d="M 0 60 Q 70 40 110 -10" fill="none" stroke-width="5" />
                <path d="M 0 0 Q -80 -40 -120 -110" fill="none" stroke-width="4" />
                <path d="M 0 -30 Q 80 -80 120 -160" fill="none" stroke-width="4" />

                <!-- Level 2 Sub-branches & Triangular Leaves Clusters -->
                <!-- Cluster Left Low -->
                <g transform="translate(-100, 20)">
                    <path d="M 0 0 L -30 -20 M 0 0 L -10 -40" fill="none" stroke-width="2.5" />
                    <polygon points="-30,-20 -45,-15 -35,-35" />
                    <polygon points="-10,-40 -25,-55 -2,-50" />
                    <circle cx="0" cy="0" r="4"/>
                </g>
                <!-- Cluster Right Low -->
                <g transform="translate(110, -10)">
                    <path d="M 0 0 L 30 -20 M 0 0 L 15 -45" fill="none" stroke-width="2.5" />
                    <polygon points="30,-20 45,-35 45,-10" />
                    <polygon points="15,-45 35,-60 10,-65" />
                    <circle cx="0" cy="0" r="4"/>
                </g>
                <!-- Cluster Left High -->
                <g transform="translate(-120, -110)">
                    <path d="M 0 0 L -25 -30 M 0 0 L 10 -40 M 0 0 L -40 0" fill="none" stroke-width="2" />
                    <polygon points="-25,-30 -45,-45 -20,-50" />
                    <polygon points="10,-40 5,-65 25,-50" />
                    <polygon points="-40,0 -55,-15 -55,15" />
                </g>
                <!-- Upper Crown Canopy Center -->
                <g transform="translate(0, -130)">
                    <path d="M 0 100 L 0 0" fill="none" stroke-width="3" />
                    <polygon points="0,0 -25,-40 25,-40" />
                    <polygon points="0,-40 -20,-75 20,-75" />
                    <polygon points="0,-75 -15,-105 15,-105" />
                    <polygon points="0,-105 -8,-125 8,-125" />
                </g>

                <!-- Wildlife Intersects: Geometric Birds nesting -->
                <path d="M 45 25 Q 60 10 75 25 Q 60 20 45 25 Z" /> <!-- Bird body -->
                <line x1="75" y1="25" x2="85" y2="20" stroke-width="2" /> <!-- Beak -->
                <path d="M -45 -45 Q -30 -60 -15 -45 Q -30 -50 -45 -45 Z" />
                <line x1="-15" y1="-45" x2="-5" y2="-50" stroke-width="2" />
            </g>


            <!-- ================= COMPONENT 2: THE SACRED TARPA SPIRAL (Right) ================= -->
            <!-- A massive multi-layered geometric spiral of interlinked tribal dancers -->
            <g transform="translate(670, 360)">
                
                <!-- Central Spiral Path Overlay Matrix (Visual Rhythm Guide) -->
                <path d="M 0 0 A 45 45 0 0 1 40 30 A 85 85 0 0 1 -60 60 A 135 135 0 0 1 -90 -90 A 185 185 0 0 1 150 -110 A 235 235 0 0 1 180 160" 
                      fill="none" stroke="#f1dfc4" stroke-width="1" stroke-dasharray="4,12" />

                <!-- Center Core: The Tarpa Player -->
                <g transform="scale(1.2)">
                    <circle cx="0" cy="-25" r="5" />
                    <polygon points="0,-18 -7,3 7,3" />
                    <polygon points="0,15 -8,2 8,2" />
                    <!-- Massive Tarpa Instrument -->
                    <path d="M 3 -5 Q 35 -35 55 -5 Q 35 10 5 -2" fill="none" stroke-width="3.5" />
                    <path d="M 45 -22 L 75 -45 L 65 -55 Z" /> <!-- Deflated end horn -->
                    <line x1="0" y1="15" x2="-7" y2="32" stroke-width="2.5" />
                    <line x1="0" y1="15" x2="7" y2="32" stroke-width="2.5" />
                </g>

                <!-- SPIRAL LAYER 1 (Inner Ring - Hand-holding structural positions) -->
                <!-- Ring calculations computed mathematically via rotation + translation matrices -->
                <g transform="rotate(45) translate(75, 0) rotate(-35)"><use href="#dancer" />
                   <line x1="-10" y1="-10" x2="-35" y2="-30" stroke-width="2" /> <!-- Interlocking Hand arm bridge --></g>
                <g transform="rotate(135) translate(80, 0) rotate(-115)"><use href="#dancer" />
                   <line x1="-10" y1="-10" x2="-25" y2="-40" stroke-width="2" /></g>
                <g transform="rotate(225) translate(85, 0) rotate(-205)"><use href="#dancer" /></g>
                <g transform="rotate(315) translate(90, 0) rotate(-295)"><use href="#dancer" /></g>

                <!-- SPIRAL LAYER 2 (Mid Large Expansion Ring) -->
                <g transform="rotate(0) translate(140, 0) rotate(15)"><use href="#dancer" /></g>
                <g transform="rotate(35) translate(145, 5) rotate(45)"><use href="#dancer" /></g>
                <g transform="rotate(70) translate(145, 10) rotate(80)"><use href="#dancer" /></g>
                <g transform="rotate(105) translate(150, 10) rotate(115)"><use href="#dancer" /></g>
                <g transform="rotate(140) translate(150, 15) rotate(150)"><use href="#dancer" /></g>
                <g transform="rotate(175) translate(155, 15) rotate(185)"><use href="#dancer" /></g>
                <g transform="rotate(210) translate(155, 20) rotate(220)"><use href="#dancer" /></g>
                <g transform="rotate(245) translate(160, 20) rotate(255)"><use href="#dancer" /></g>
                <g transform="rotate(280) translate(165, 25) rotate(290)"><use href="#dancer" /></g>
                <g transform="rotate(315) translate(165, 25) rotate(325)"><use href="#dancer" /></g>
                <g transform="rotate(350) translate(170, 30) rotate(360)"><use href="#dancer" /></g>

                <!-- SPIRAL LAYER 3 (Outer Climax Arc) -->
                <g transform="rotate(15) translate(220, 20) rotate(30) scale(0.9)"><use href="#dancer" /></g>
                <g transform="rotate(40) translate(225, 25) rotate(55) scale(0.9)"><use href="#dancer" /></g>
                <g transform="rotate(65) translate(230, 30) rotate(80) scale(0.9)"><use href="#dancer" /></g>
                <g transform="rotate(90) translate(235, 35) rotate(105) scale(0.9)"><use href="#dancer" /></g>
                <g transform="rotate(115) translate(240, 40) rotate(130) scale(0.9)"><use href="#dancer" /></g>
                <g transform="rotate(140) translate(245, 45) rotate(155) scale(0.9)"><use href="#dancer" /></g>
                <g transform="rotate(165) translate(250, 50) rotate(180) scale(0.9)"><use href="#dancer" /></g>
