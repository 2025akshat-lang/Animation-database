<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscillatory Motion - Swing Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-top: 10px;
            font-size: 1.4rem;
            color: #facc15;
            text-align: center;
        }
        p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 10px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        canvas {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 95vw;
            max-height: 65vh;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }
        button:hover {
            background: #1d4ed8;
        }
        button.sound-btn {
            background: #22c55e;
            color: #000;
        }
        button.sound-btn.off {
            background: #ef4444;
            color: #fff;
        }
        label {
            font-size: 0.85rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        input[type=range] {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <canvas id="swingCanvas" width="500" height="420"></canvas>

        
    </div>

    <script>
        const canvas = document.getElementById('swingCanvas');
        const ctx = canvas.getContext('2d');

        // Frame and Anchor points
        const topBarY = 90;
        const anchorLeftX = 210;
        const anchorRightX = 290;
        const ropeLength = 180;
        const groundY = 360;

        // Physics variables
        let maxAngle = 30 * (Math.PI / 180); 
        let time = 0;
        let isPlaying = true;
        let speed = 0.04;

        // Enhanced Sound Synthesis Setup
        let audioCtx = null;
        let isAudioPlaying = false;
        let windNoiseNode = null;
        let birdInterval = null;

        const playBtn = document.getElementById('playBtn');
        const soundBtn = document.getElementById('soundBtn');
        const angleSlider = document.getElementById('angleSlider');

        angleSlider.addEventListener('input', (e) => {
            maxAngle = parseFloat(e.target.value) * (Math.PI / 180);
        });

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.innerText = isPlaying ? "⏸️ Pause" : "▶️ Play";
        });

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Louder Wind / Ambient Park Sound
        function startParkAmbience() {
            if (!audioCtx) return;

            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            windNoiseNode = audioCtx.createBufferSource();
            windNoiseNode.buffer = buffer;
            windNoiseNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, audioCtx.currentTime);

            // --- BOOSTED VOLUME ---
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.28, audioCtx.currentTime);

            windNoiseNode.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            windNoiseNode.start();

            // Birds Chirping Chirp Generator
            birdInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx) return;
                
                let osc = audioCtx.createOscillator();
                let birdGain = audioCtx.createGain();

                osc.type = 'sine';
                let startFreq = 2200 + Math.random() * 800;
                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(startFreq + 600, audioCtx.currentTime + 0.08);

                birdGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                birdGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

                osc.connect(birdGain);
                birdGain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }, 1800);
        }

        soundBtn.addEventListener('click', () => {
            initAudio();
            isAudioPlaying = !isAudioPlaying;

            if (isAudioPlaying) {
                soundBtn.innerText = "🔇 Stop Sound";
                soundBtn.classList.remove('off');
                startParkAmbience();
            } else {
                soundBtn.innerText = "🔊 Tap for High-Volume Park Sound";
                soundBtn.classList.add('off');
                if (windNoiseNode) {
                    try { windNoiseNode.stop(); } catch(e){}
                }
                if (birdInterval) clearInterval(birdInterval);
            }
        });

        // Draw Background Grass & Metal Frame
        function drawScene() {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#0f172a');
            skyGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grass patch under swing
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.ellipse(250, groundY + 10, 160, 30, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.ellipse(250, groundY + 5, 140, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            // A-Frame Metal Structure
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';

            // Left A-Leg
            ctx.beginPath();
            ctx.moveTo(anchorLeftX - 30, topBarY);
            ctx.lineTo(80, groundY + 15);
            ctx.moveTo(anchorLeftX - 30, topBarY);
            ctx.lineTo(160, groundY + 15);
            ctx.stroke();

            // Right A-Leg
            ctx.beginPath();
            ctx.moveTo(anchorRightX + 30, topBarY);
            ctx.lineTo(340, groundY + 15);
            ctx.moveTo(anchorRightX + 30, topBarY);
            ctx.lineTo(420, groundY + 15);
            ctx.stroke();

            // Top Horizontal Bar
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 9;
            ctx.beginPath();
            ctx.moveTo(150, topBarY);
            ctx.lineTo(350, topBarY);
            ctx.stroke();

            // Support clamps
            ctx.fillStyle = '#475569';
            ctx.fillRect(anchorLeftX - 6, topBarY - 6, 12, 12);
            ctx.fillRect(anchorRightX - 6, topBarY - 6, 12, 12);
        }

        // Main Animation Loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawScene();

            let currentAngle = maxAngle * Math.cos(time);

            let midAnchorX = (anchorLeftX + anchorRightX) / 2;
            let seatCenterX = midAnchorX + ropeLength * Math.sin(currentAngle);
            let seatCenterY = topBarY + ropeLength * Math.cos(currentAngle);

            let ropeOffsetX = 18 * Math.cos(currentAngle);
            let ropeOffsetY = -18 * Math.sin(currentAngle);

            let seatLeftX = seatCenterX - ropeOffsetX;
            let seatLeftY = seatCenterY - ropeOffsetY;
            let seatRightX = seatCenterX + ropeOffsetX;
            let seatRightY = seatCenterY + ropeOffsetY;

            // Draw Ropes
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 3.5;
            
            ctx.beginPath();
            ctx.moveTo(anchorLeftX, topBarY);
            ctx.lineTo(seatLeftX, seatLeftY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(anchorRightX, topBarY);
            ctx.lineTo(seatRightX, seatRightY);
            ctx.stroke();

            // Draw Boy on Swing
            ctx.save();
            ctx.translate(seatCenterX, seatCenterY);
            ctx.rotate(currentAngle);

            // Swing Wooden Seat
            ctx.fillStyle = '#b45309';
            ctx.fillRect(-22, -4, 44, 8);

            // Boy's Body (Torso)
            ctx.fillStyle = '#dc2626'; 
            ctx.beginPath();
            ctx.ellipse(-2, -28, 10, 16, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // Legs extended forward/backward with motion
            ctx.strokeStyle = '#1e3a8a'; 
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(-4, -14);
            ctx.lineTo(12, -2);
            ctx.lineTo(26, -4); 
            ctx.stroke();

            // Shoes
            ctx.fillStyle = '#451a03';
            ctx.beginPath();
            ctx.arc(28, -4, 4, 0, Math.PI * 2);
            ctx.fill();

            // Arms holding rope
            ctx.strokeStyle = '#fcd34d';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-4, -34);
            ctx.lineTo(-14, -22);
            ctx.stroke();

            // Head
            ctx.fillStyle = '#fcd34d';
            ctx.beginPath();
            ctx.arc(2, -48, 10, 0, Math.PI * 2);
            ctx.fill();

            // Hair & Glasses
            ctx.fillStyle = '#292524';
            ctx.beginPath();
            ctx.arc(0, -51, 10, Math.PI * 0.8, Math.PI * 2.1);
            ctx.fill();

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(6, -48, 3.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();

            if (isPlaying) {
                time += speed;
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
