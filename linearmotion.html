<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Motion - Kids Marching with Band Sound</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-top: 10px;
            font-size: 1.4rem;
            color: #facc15;
            text-align: center;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        canvas {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 95vw;
            max-height: 65vh;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }
        button:hover {
            background: #1d4ed8;
        }
        button.sound-btn {
            background: #22c55e;
            color: #000;
        }
        button.sound-btn.off {
            background: #ef4444;
            color: #fff;
        }
        label {
            font-size: 0.85rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        input[type=range] {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚶‍♂️ Linear Motion (Straight Line Motion) 🥁</h1>
        <p>Interactive Simulation of Students Marching in a Straight Line with School Band Sound</p>

        <canvas id="marchCanvas" width="550" height="380"></canvas>

        <div class="controls">
            <button id="playBtn">⏸️ Pause</button>
            <button id="soundBtn" class="sound-btn off">🔊 Tap for Marching Band Sound</button>
            <label>
                Speed:
                <input type="range" id="speedSlider" min="1" max="4" step="0.5" value="2">
            </label>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('marchCanvas');
        const ctx = canvas.getContext('2d');

        let isPlaying = true;
        let marchaStep = 0;
        let marchSpeed = 2;
        let leadPositionX = 0;

        const numStudents = 7;
        const studentSpacing = 45;

        // Sound Synthesis Variables
        let audioCtx = null;
        let isAudioPlaying = false;
        let marchInterval = null;

        const playBtn = document.getElementById('playBtn');
        const soundBtn = document.getElementById('soundBtn');
        const speedSlider = document.getElementById('speedSlider');

        speedSlider.addEventListener('input', (e) => {
            marchSpeed = parseFloat(e.target.value);
        });

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.innerText = isPlaying ? "⏸️ Pause" : "▶️ Play";
        });

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Synthesize Drum Beats & Marching Footstep Sounds
        function playMarchingBandBeat() {
            let beat = 0;
            const brassNotes = [261.63, 329.63, 392.00, 523.25]; // C E G C (Brass Trumpet feel)

            marchInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx || !isPlaying) return;

                let now = audioCtx.currentTime;

                // 1. Snare Drum / Footstep Impact (Noise)
                let bufferSize = audioCtx.sampleRate * 0.08;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                let noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'highpass';
                noiseFilter.frequency.setValueAtTime(1000, now);

                let noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.35, now); // Loud footstep/snare
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);

                // 2. Heavy Bass Drum on Beat 0 and 2
                if (beat % 2 === 0) {
                    let bassOsc = audioCtx.createOscillator();
                    let bassGain = audioCtx.createGain();

                    bassOsc.type = 'sine';
                    bassOsc.frequency.setValueAtTime(120, now);
                    bassOsc.frequency.exponentialRampToValueAtTime(40, now + 0.12);

                    bassGain.gain.setValueAtTime(0.5, now); // Strong Bass
                    bassGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                    bassOsc.connect(bassGain);
                    bassGain.connect(audioCtx.destination);

                    bassOsc.start(now);
                    bassOsc.stop(now + 0.13);
                }

                // 3. School Brass Band Fanfare Motif
                let brassOsc = audioCtx.createOscillator();
                let brassGain = audioCtx.createGain();

                brassOsc.type = 'sawtooth';
                brassOsc.frequency.setValueAtTime(brassNotes[beat % brassNotes.length], now);

                brassGain.gain.setValueAtTime(0.18, now);
                brassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                brassOsc.connect(brassGain);
                brassGain.connect(audioCtx.destination);

                brassOsc.start(now);
                brassOsc.stop(now + 0.21);

                beat++;
            }, 320);
        }

        soundBtn.addEventListener('click', () => {
            initAudio();
            isAudioPlaying = !isAudioPlaying;

            if (isAudioPlaying) {
                soundBtn.innerText = "🔇 Stop Sound";
                soundBtn.classList.remove('off');
                playMarchingBandBeat();
            } else {
                soundBtn.innerText = "🔊 Tap for Marching Band Sound";
                soundBtn.classList.add('off');
                if (marchInterval) clearInterval(marchInterval);
            }
        });

        function drawBackground() {
            // Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#0284c7');
            skyGrad.addColorStop(0.6, '#38bdf8');
            skyGrad.addColorStop(1, '#bae6fd');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Green Field
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(0, 220, canvas.width, 160);

            // Reddish-Brown Straight Track (Linear Path)
            ctx.fillStyle = '#b45309';
            ctx.beginPath();
            ctx.moveTo(0, 240);
            ctx.lineTo(canvas.width, 240);
            ctx.lineTo(canvas.width, 360);
            ctx.lineTo(0, 360);
            ctx.fill();

            // Track Borders / Straight Line Motion Guidelines
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 3;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(0, 250);
            ctx.lineTo(canvas.width, 250);
            ctx.moveTo(0, 350);
            ctx.lineTo(canvas.width, 350);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash
        }

        function drawStudent(x, y, index, marchaPhase) {
            ctx.save();
            ctx.translate(x, y);

            let swingAngle = Math.sin(marchaPhase) * 0.45;

            // Shadows
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(0, 42, 18, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Uniform Color Scheme (Matching the image: Maroon Kurti / White Salwar)
            let kurtiColor = (index === 0) ? '#78350f' : '#881337'; // Leader in brown, rest in maroon
            let salwarColor = '#f8fafc';

            // Left Leg
            ctx.save();
            ctx.rotate(swingAngle);
            ctx.fillStyle = salwarColor;
            ctx.fillRect(-6, 0, 10, 34);
            ctx.fillStyle = '#1e293b'; // Shoe
            ctx.beginPath();
            ctx.arc(-1, 35, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Right Leg (Opposite Phase)
            ctx.save();
            ctx.rotate(-swingAngle);
            ctx.fillStyle = salwarColor;
            ctx.fillRect(-2, 0, 10, 34);
            ctx.fillStyle = '#1e293b'; // Shoe
            ctx.beginPath();
            ctx.arc(3, 35, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Torso (Kurti)
            ctx.fillStyle = kurtiColor;
            ctx.fillRect(-12, -35, 24, 38);

            // Left Arm (Marching extended stance like in textbook image)
            ctx.save();
            ctx.translate(8, -28);
            ctx.rotate(-swingAngle * 0.8 + 0.2);
            ctx.fillStyle = kurtiColor;
            ctx.fillRect(0, 0, 18, 8); // Arm extended forward
            ctx.fillStyle = '#fde047'; // Hand
            ctx.beginPath();
            ctx.arc(19, 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Right Arm
            ctx.save();
            ctx.translate(-8, -28);
            ctx.rotate(swingAngle * 0.8 - 0.2);
            ctx.fillStyle = kurtiColor;
            ctx.fillRect(-16, 0, 16, 8);
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(-17, 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Head & Hair
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(0, -46, 11, 0, Math.PI * 2);
            ctx.fill();

            // Black Hair (Pony Tails)
            ctx.fillStyle = '#1c1917';
            ctx.beginPath();
            ctx.arc(-2, -49, 12, Math.PI * 0.6, Math.PI * 2.3);
            ctx.fill();

            // Glasses
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(4, -46, 3.5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();

            if (isPlaying) {
                leadPositionX += marchSpeed;
                marchaStep += 0.1 * marchSpeed;

                if (leadPositionX - (numStudents * studentSpacing) > canvas.width) {
                    leadPositionX = -50;
                }
            }

            // Draw students in straight-line sequence
            for (let i = numStudents - 1; i >= 0; i--) {
                let x = leadPositionX - (i * studentSpacing);
                let y = 290; 

                // Draw only if on canvas
                if (x > -60 && x < canvas.width + 60) {
                    drawStudent(x, y, i, marchaStep);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
