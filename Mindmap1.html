<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Solution Mind Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }

        .controls-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 14px 28px;
            border-radius: 24px; display: flex; align-items: center; gap: 15px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .search-box input { background: rgba(15, 23, 42, 0.8); border: 1px solid #45a29e; color: #66fcf1; padding: 8px 14px; border-radius: 12px; outline: none; font-size: 0.9rem; }
        .btn { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #0b0c10; border: none; padding: 8px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        .node circle { cursor: pointer; stroke-width: 3px; }
        .node text { font-size: 11px; fill: #fff; cursor: pointer; text-anchor: middle; font-weight: 500; }
        .node text.hi { fill: #ffbd59; font-weight: bold; }
        .link { fill: none; stroke: #1f2833; stroke-width: 2px; }
        .link.active { stroke: #45a29e; }
        .node.highlight circle { stroke: #ffbd59 !important; fill: #ffbd59 !important; filter: drop-shadow(0px 0px 10px #ffbd59) !important; }

        /* Modal styling kept same */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1f2833; border: 1px solid #66fcf1; padding: 24px; border-radius: 20px; max-width: 450px; width: 90%; color: #c5c6c7; }
        .close-btn { cursor: pointer; float: right; }
    </style>
</head>
<body>

    <div class="controls-panel">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearch()">
        </div>
        <button class="btn" onclick="exportPNG()">📸</button>
    </div>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2><h3 id="modalTitleHi"></h3>
            <p id="modalDesc"></p><div id="modalFormula" style="margin-top:10px;"></div>
        </div>
    </div>

    <svg id="mindmap" width="100%" height="100%"></svg>

    <script>
        const treeData = {
            name: "SOLUTION", hi: "विलयन",
            children: [{
                name: "HOMOGENEOUS", hi: "समांगी",
                children: [
                    { name: "SOLUTE", hi: "विलेय" },
                    { name: "SOLVENT", hi: "विलायक", children: [
                        { name: "CONCENTRATION", hi: "सांद्रता", children: [
                            { name: "MASS %", hi: "द्रव्यमान %", formula: "$$Mass \\% = \\frac{m_{solute}}{m_{total}} \\times 100$$" },
                            { name: "VOLUME %", hi: "आयतन %", formula: "$$Vol \\% = \\frac{v_{solute}}{v_{total}} \\times 100$$" }
                        ]}
                    ]}
                ]
            }]
        };

        const width = window.innerWidth;
        const height = window.innerHeight;
        let i = 0, duration = 500, root;

        // Tree size set for vertical layout
        const treemap = d3.tree().size([width - 100, height - 200]);

        const svg = d3.select("#mindmap")
            .call(d3.zoom().on("zoom", (event) => g.attr("transform", event.transform)))
            .append("g");

        const g = svg.append("g").attr("transform", "translate(50,50)");

        root = d3.hierarchy(treeData, d => d.children);
        root.x0 = width / 2; root.y0 = 0;

        function collapse(d) {
            if (d.children) { d._children = d.children; d._children.forEach(collapse); d.children = null; }
        }
        if (root.children) root.children.forEach(collapse);

        update(root);

        function update(source) {
            const treeData = treemap(root);
            const nodes = treeData.descendants();
            const links = treeData.descendants().slice(1);

            // X is horizontal, Y is vertical depth
            nodes.forEach(d => { d.y = d.depth * 100; });

            const node = g.selectAll('g.node').data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => `translate(${source.x0},${source.y0})`)
                .on('click', (event, d) => { click(event, d); });

            nodeEnter.append('circle').attr('r', 1e-6).style("fill", d => d._children ? "#ff007f" : "#00f2fe");

            // Text positioned BELOW the circle
            nodeEnter.append('text').attr("dy", "2.5em").text(d => d.data.name);
            nodeEnter.append('text').attr("class", "hi").attr("dy", "3.8em").text(d => d.data.hi);

            const nodeUpdate = nodeEnter.merge(node);
            nodeUpdate.transition().duration(duration)
                .attr("transform", d => `translate(${d.x},${d.y})`);

            nodeUpdate.select('circle').attr('r', 8);

            node.exit().transition().duration(duration)
                .attr("transform", d => `translate(${source.x},${source.y})`).remove();

            const link = g.selectAll('path.link').data(links, d => d.id);
            const linkEnter = link.enter().insert('path', "g").attr("class", "link")
                .attr('d', d => verticalDiagonal({x: source.x0, y: source.y0}, {x: source.x0, y: source.y0}));

            linkEnter.merge(link).transition().duration(duration)
                .attr('d', d => verticalDiagonal(d, d.parent))
                .attr("class", "link active");

            link.exit().remove();

            nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });

            // Updated Diagonal for Vertical (Swapped X and Y)
            function verticalDiagonal(s, d) {
                return `M ${s.x} ${s.y} C ${s.x} ${(s.y + d.y) / 2}, ${d.x} ${(s.y + d.y) / 2}, ${d.x} ${d.y}`;
            }

            function click(event, d) {
                if (d.children) { d._children = d.children; d.children = null; }
                else { d.children = d._children; d._children = null; }
                update(d);
            }
        }

        // Search and Modal functions remain same...
        function handleSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            d3.selectAll(".node").classed("highlight", false);
            if (query !== "") {
                d3.selectAll(".node").filter(d => d.data.name.toLowerCase().includes(query)).classed("highlight", true);
            }
        }
        function closeModal() { document.getElementById("infoModal").style.display = "none"; }
    </script>
</body>
</html>
