<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exploring Magnets - Interactive Game</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #fff9c4);
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    h1 {
      color: #00796b;
      margin: 5px 0;
      font-size: 1.5rem;
      text-align: center;
    }

    p.subtitle {
      color: #555;
      font-size: 0.85rem;
      margin: 0 0 10px 0;
      text-align: center;
    }

    #lab-container {
      width: 100%;
      max-width: 500px;
      height: 380px;
      background: #ffffff;
      border: 3px solid #009688;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    /* Magnet Styles */
    #magnet {
      width: 80px;
      height: 36px;
      position: absolute;
      top: 15px;
      left: 15px;
      cursor: grab;
      display: flex;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      z-index: 100;
      touch-action: none;
    }

    .pole-n {
      width: 50%;
      background: #e53935;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
    }

    .pole-s {
      width: 50%;
      background: #1e88e5;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      border-top-right-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    /* Grid layout for items so they never overflow */
    #items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 70px 10px 10px 10px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .draggable-item {
      padding: 8px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.8rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      height: 40px;
      transition: transform 0.2s ease;
    }

    .magnetic {
      background: #eceff1;
      border: 2px solid #607d8b;
      color: #37474f;
    }

    .non-magnetic {
      background: #fff3e0;
      border: 2px solid #ffb74d;
      color: #e65100;
    }

    /* Message Box */
    #status-box {
      margin-top: 10px;
      padding: 8px 15px;
      background: #ffffff;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      width: 90%;
      max-width: 500px;
    }

    /* Scoreboard */
    #score-board {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .score-tag {
      padding: 5px 10px;
      border-radius: 6px;
    }

    .mag-score { background-color: #c8e6c9; color: #2e7d32; }
    .non-mag-score { background-color: #ffe0b2; color: #ef6c00; }
  </style>
</head>
<body>

  <h1>🧲 Magnet Lab</h1>
  <p class="subtitle">Magnet ko drag karke objects ke paas le jao!</p>

  <div id="lab-container">
    <!-- Magnet -->
    <div id="magnet">
      <div class="pole-n">N</div>
      <div class="pole-s">S</div>
    </div>

    <!-- Items Grid -->
    <div id="items-grid">
      <div class="draggable-item magnetic" data-type="magnetic" data-name="Iron Nail">📌 Iron Nail</div>
      <div class="draggable-item non-magnetic" data-type="non-magnetic" data-name="Pencil">✏️ Pencil</div>
      <div class="draggable-item magnetic" data-type="magnetic" data-name="Paper Clip">📎 Paper Clip</div>
      <div class="draggable-item non-magnetic" data-type="non-magnetic" data-name="Eraser">🧹 Eraser</div>
      <div class="draggable-item magnetic" data-type="magnetic" data-name="Iron Key">🔑 Iron Key</div>
      <div class="draggable-item non-magnetic" data-type="non-magnetic" data-name="Plastic Ruler">📏 Plastic Ruler</div>
    </div>
  </div>

  <div id="status-box">Magnet ko drag karke test karo!</div>

  <div id="score-board">
    <div class="score-tag mag-score">Attracted: <span id="mag-count">0</span>/3</div>
    <div class="score-tag non-mag-score">Not Attracted: <span id="non-mag-count">0</span>/3</div>
  </div>

  <script>
    const magnet = document.getElementById('magnet');
    const container = document.getElementById('lab-container');
    const statusBox = document.getElementById('status-box');
    const items = document.querySelectorAll('.draggable-item');

    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    let stuckMagneticCount = 0;
    let testedNonMagnetic = new Set();

    // Touch & Mouse Dragging
    magnet.addEventListener('mousedown', startDrag);
    magnet.addEventListener('touchstart', startDrag, { passive: false });

    document.addEventListener('mousemove', onDrag);
    document.addEventListener('touchmove', onDrag, { passive: false });

    document.addEventListener('mouseup', stopDrag);
    document.addEventListener('touchend', stopDrag);

    function startDrag(e) {
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      startX = clientX;
      startY = clientY;
      initialLeft = magnet.offsetLeft;
      initialTop = magnet.offsetTop;
    }

    function onDrag(e) {
      if (!isDragging) return;
      e.preventDefault();

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = clientX - startX;
      const deltaY = clientY - startY;

      let newLeft = initialLeft + deltaX;
      let newTop = initialTop + deltaY;

      // Restrict magnet inside box boundaries
      const maxLeft = container.clientWidth - magnet.offsetWidth;
      const maxTop = container.clientHeight - magnet.offsetHeight;

      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));

      magnet.style.left = `${newLeft}px`;
      magnet.style.top = `${newTop}px`;

      checkAttraction();
    }

    function stopDrag() {
      isDragging = false;
    }

    function checkAttraction() {
      const magRect = magnet.getBoundingClientRect();

      items.forEach(item => {
        if (item.classList.contains('stuck')) return;

        const itemRect = item.getBoundingClientRect();

        const distance = Math.hypot(
          (magRect.left + magRect.width / 2) - (itemRect.left + itemRect.width / 2),
          (magRect.top + magRect.height / 2) - (itemRect.top + itemRect.height / 2)
        );

        if (distance < 50) {
          const isMagnetic = item.getAttribute('data-type') === 'magnetic';
          const itemName = item.getAttribute('data-name');

          if (isMagnetic) {
            item.classList.add('stuck');
            magnet.appendChild(item);
            item.style.position = 'absolute';
            item.style.top = '0px';
            item.style.left = '0px';
            item.style.width = '100%';
            item.style.opacity = '0.9';

            statusBox.style.color = '#2e7d32';
            statusBox.innerText = `✨ ${itemName} stuck to magnet! (Magnetic Material)`;
            
            stuckMagneticCount++;
            document.getElementById('mag-count').innerText = stuckMagneticCount;
          } else {
            statusBox.style.color = '#d32f2f';
            statusBox.innerText = `❌ ${itemName} did NOT stick! (Non-Magnetic)`;
            
            if (!testedNonMagnetic.has(itemName)) {
              testedNonMagnetic.add(itemName);
              document.getElementById('non-mag-count').innerText = testedNonMagnetic.size;
            }
          }
        }
      });
    }
  </script>
</body>
</html>
