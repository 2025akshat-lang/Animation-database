<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modular Science Visual Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #080a12; font-family: 'Segoe UI', sans-serif; color: #fff; }

        .app-container { display: flex; height: 100vh; width: 100vw; flex-direction: column; }

        /* Desktop view me Side-by-side rahega */
        @media (min-width: 768px) {
            .app-container { flex-direction: row; }
        }

        /* Responsive Navigation Sidebar / Topbar */
        .sidebar {
            width: 100%;
            max-height: 45vh;
            background: #0f1426;
            border-bottom: 2px solid #1c2541;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
            z-index: 10;
            overflow-y: auto;
        }

        @media (min-width: 768px) {
            .sidebar {
                width: 280px;
                max-height: 100vh;
                border-bottom: none;
                border-right: 2px solid #1c2541;
                padding: 15px;
                gap: 12px;
            }
        }

        .brand-title { font-size: 1rem; color: #00f2fe; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        /* Module Accordion / Block Styling */
        .topic-block { background: #171f38; border: 1px solid #2a3861; border-radius: 8px; overflow: hidden; }
        .topic-header { padding: 8px 12px; font-size: 0.85rem; font-weight: 600; background: #1e294b; color: #e0e6ed; }

        .sub-menu { display: flex; flex-wrap: wrap; background: #12182c; gap: 4px; padding: 5px; }
        
        @media (min-width: 768px) {
            .sub-menu { flex-direction: column; gap: 0; padding: 0; }
        }

        .sub-btn {
            padding: 6px 10px;
            font-size: 0.75rem;
            color: #94a3b8;
            background: #171f38;
            border: 1px solid #273763;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 1 auto;
        }

        @media (min-width: 768px) {
            .sub-btn {
                font-size: 0.85rem;
                padding: 10px 15px 10px 20px;
                background: transparent;
                border: none;
                border-radius: 0;
                text-align: left;
                border-left: 3px solid transparent;
            }
        }

        .sub-btn:hover { background: #1c2646; color: #fff; }
        .sub-btn.active { color: #00f2fe; border-color: #00f2fe; background: rgba(0, 242, 254, 0.15); font-weight: bold; }
        
        @media (min-width: 768px) {
            .sub-btn.active { border-left-color: #00f2fe; border-top: none; border-right: none; border-bottom: none; }
        }

        /* Canvas & Info Stage */
        .viewport-stage { flex: 1; position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
        canvas { flex: 1; width: 100%; height: 100%; display: block; }

        .info-card {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(15, 20, 38, 0.92);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 8px;
            padding: 10px 15px;
            text-align: center;
            backdrop-filter: blur(8px);
            z-index: 5;
        }
        .info-card h3 { color: #ff007f; font-size: 0.85rem; margin-bottom: 3px; }
        .info-card p { color: #cbd5e1; font-size: 0.75rem; line-height: 1.3; }

        @media (min-width: 768px) {
            .info-card { bottom: 20px; padding: 15px 20px; }
            .info-card h3 { font-size: 1rem; }
            .info-card p { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Modular Sidebar Menu -->
    <div class="sidebar">
        <div class="brand-title">🔬 Science Engine</div>
        
        <!-- BLOCK 1: NEWTON'S LAWS -->
        <div class="topic-block">
            <div class="topic-header">⚡ Newton's Laws of Motion</div>
            <div class="sub-menu">
                <button class="sub-btn active" onclick="LabEngine.loadModule('newton_law1', this)">1st Law (Inertia)</button>
                <button class="sub-btn" onclick="LabEngine.loadModule('newton_law2', this)">2nd Law (F = ma)</button>
                <button class="sub-btn" onclick="LabEngine.loadModule('newton_law3', this)">3rd Law (Action-Reaction)</button>
            </div>
        </div>

        <!-- BLOCK 2: ATOMIC STRUCTURE -->
        <div class="topic-block">
            <div class="topic-header">⚛️ Atomic Structure</div>
            <div class="sub-menu">
                <button class="sub-btn" onclick="LabEngine.loadModule('rutherford', this)">Rutherford Scattering</button>
                <button class="sub-btn" onclick="LabEngine.loadModule('bohr_model', this)">Bohr Model (Advanced)</button>
            </div>
        </div>
    </div>

    <!-- Main Rendering Area -->
    <div class="viewport-stage">
        <canvas id="mainCanvas"></canvas>
        <div class="info-card">
            <h3 id="moduleTitle">Loading...</h3>
            <p id="moduleDesc">Loading module description...</p>
        </div>
    </div>
</div>

<script>
// ==========================================
// CENTRAL ENGINE FRAMEWORK
// ==========================================
const LabEngine = {
    canvas: null,
    ctx: null,
    currentModule: null,

    init() {
        this.canvas = document.getElementById('mainCanvas');
        this.ctx = this.canvas.getContext('2d');
        
        window.addEventListener('resize', () => this.resize());
        this.resize();

        const defaultBtn = document.querySelector('.sub-btn.active');
        this.loadModule('newton_law1', defaultBtn);
        
        this.loop();
    },

    resize() {
        if(!this.canvas) return;
        this.canvas.width = this.canvas.parentElement.clientWidth;
        this.canvas.height = this.canvas.parentElement.clientHeight;
        if(this.currentModule && this.currentModule.resize) {
            this.currentModule.resize(this.canvas.width, this.canvas.height);
        }
    },

    loadModule(moduleId, btnElement) {
        if (!Modules[moduleId]) return;

        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        if(btnElement) btnElement.classList.add('active');

        if (this.currentModule && this.currentModule.cleanup) {
            this.currentModule.cleanup();
        }

        this.currentModule = Modules[moduleId];
        
        document.getElementById('moduleTitle').innerText = this.currentModule.title;
        document.getElementById('moduleDesc').innerText = this.currentModule.desc;

        this.resize();
        this.currentModule.init(this.canvas.width, this.canvas.height);
    },

    loop() {
        this.ctx.fillStyle = 'rgba(8, 10, 18, 0.25)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        if (this.currentModule && this.currentModule.render) {
            this.currentModule.render(this.ctx, this.canvas.width, this.canvas.height);
        }

        requestAnimationFrame(() => this.loop());
    }
};

// ==========================================
// INDEPENDENT EXPERIMENT MODULES
// ==========================================
const Modules = {};

// 1. Newton 1st Law
Modules['newton_law1'] = {
    title: "Newton's First Law (Inertia)",
    desc: "A body stays at rest or uniform motion unless acted upon by an external force.",
    particles: [],

    init(w, h) {
        this.particles = Array.from({length: 30}, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            color: '#00f2fe'
        }));
    },

    render(ctx, w, h) {
        this.particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x < 0 || p.x > w) p.vx *= -1;
            if(p.y < 0 || p.y > h) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
            ctx.fillStyle = p.color;
            ctx.fill();
        });
    }
};

// 2. Newton 2nd Law
Modules['newton_law2'] = {
    title: "Newton's Second Law (F = ma)",
    desc: "Acceleration depends on Mass and Force applied.",
    box: { x: 50, vx: 2 },

    init(w, h) {
        this.box.x = 50;
        this.box.vx = 2;
    },

    render(ctx, w, h) {
        let centerY = h / 2 - 20;
        this.box.x += this.box.vx;
        if(this.box.x > w - 50 || this.box.x < 50) this.box.vx *= -1;

        ctx.fillStyle = '#ff007f';
        ctx.fillRect(this.box.x - 20, centerY - 20, 40, 40);
        
        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.box.x, centerY);
        ctx.lineTo(this.box.x + (this.box.vx * 15), centerY);
        ctx.stroke();
    }
};

// 3. Newton 3rd Law
Modules['newton_law3'] = {
    title: "Newton's Third Law (Action-Reaction)",
    desc: "For every action, there is an equal and opposite reaction.",
    p1: { x: 0, dx: 1.5 },
    p2: { x: 0, dx: -1.5 },

    init(w, h) {
        this.p1.x = w/2 - 40;
        this.p2.x = w/2 + 40;
    },

    render(ctx, w, h) {
        let centerY = h / 2 - 20;

        this.p1.x += this.p1.dx;
        this.p2.x += this.p2.dx;

        if(Math.abs(this.p1.x - this.p2.x) < 30) {
            this.p1.dx *= -1;
            this.p2.dx *= -1;
        }

        if(this.p1.x < 30 || this.p2.x > w - 30) {
            this.p1.dx *= -1;
            this.p2.dx *= -1;
        }

        ctx.beginPath();
        ctx.arc(this.p1.x, centerY, 15, 0, Math.PI*2);
        ctx.fillStyle = '#ffdf00';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.p2.x, centerY, 15, 0, Math.PI*2);
        ctx.fillStyle = '#ff4500';
        ctx.fill();
    }
};

// Rutherford Placeholder
Modules['rutherford'] = {
    title: "Rutherford Scattering",
    desc: "Alpha particles deflecting from gold nucleus.",
    init() {}, render(ctx, w, h) {
        ctx.fillStyle = '#ffdf00';
        ctx.beginPath();
        ctx.arc(w/2, h/2 - 20, 20, 0, Math.PI*2);
        ctx.fill();
    }
};

// Bohr Placeholder
Modules['bohr_model'] = {
    title: "Bohr Model",
    desc: "Electrons orbiting in specific energy shells.",
    angle: 0,
    init() {}, render(ctx, w, h) {
        let cx = w/2, cy = h/2 - 20;
        ctx.strokeStyle = '#344484';
        ctx.beginPath(); ctx.arc(cx, cy, 40, 0, Math.PI*2); ctx.stroke();
        
        this.angle += 0.05;
        let ex = cx + Math.cos(this.angle) * 40;
        let ey = cy + Math.sin(this.angle) * 40;
        ctx.fillStyle = '#00f2fe';
        ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI*2); ctx.fill();
    }
};

window.onload = () => LabEngine.init();
</script>
</body>
</html>
