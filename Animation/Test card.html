<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Happy Birthday, Ghostie! 🎂👻</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #0d1117, #161b22, #21262d);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: white;
        overflow: hidden;
      }

      /* Main Card Container */
      .card {
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 24px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        max-width: 100%;
        width: 100%;
        position: relative;
        z-index: 10;
      }

      /* Animated Ghost Icon */
      .ghem {
        font-size: 80px; 
        display: inline-block;
        animation: floatBhoot 3.5s infinite ease-in-out;
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
      }

      /* Text Styling */
      h1 {
        margin: 15px 0 5px;
        font-size: 28px;
        letter-spacing: 1px;
        color: #58a6ff;
        text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
      }

      p {
        font-size: 16px;
        color: #8b949e;
        margin-bottom: 25px;
        line-height: 1.4;
      }
      .icon {
        position: absolute;
        font-size: 24px;
        opacity: 0.7;
        animation: floatBhoot infinite ease-in-out;
      }

      .btn {
        background: linear-gradient(45deg, #238636, #2ea043);
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(46, 160, 67, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(46, 160, 67, 0.6);
      }

      .btn:active {
        transform: scale(0.95);
      }
      .floating-icons {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 2;
      }
      .nachnewalaemoj{font-size:35px; position:absolute;
        
        animation: bitmoj infinite ease-in-out;}

      /* Bhoot Animation */
      @keyframes floatBhoot {
        0%   { transform: translateY(0px) rotate(0deg) scale(1); }
        25%  { transform: translateY(-40px) rotate(-10deg) scale(1.1); }
        50%  { transform: translateY(0px) rotate(0deg) scale(1); }
        75%  { transform: translateY(40px) rotate(10deg) scale(0.95); }
        100% { transform: translateY(0px) rotate(0deg) scale(1); }
        125%{ transform: translateX(-40px) rotate(10deg) scale(1.1);}
      }
      
      @keyframes bitmoj {0%{transform: translateY(0) rotate(0deg);}
      25%{transform: translateY(-20px) rotate(180deg);}
      50%{transform: translateY(0)rotate(360deg);}
      75%{transform: translateY (20px)rotate(360deg);}
      100%{transfrom: translateY(0)rotate(0deg);}
      }
      
    </style>
  </head>
  <body>
    <div ><span class="nachnewalaemoj" style="top: 5%; left: 5%; animation-duration:
      4s;">🥳</span>
      <span class="nachnewalaemoj" style="top: 5%; right: 10%; animation-duration:
      4s;">🥳</span>
      <span class="nachnewalaemoj" style="bottom: 5%; left: 10%; animation-duration:
      4s;">🥳</span>
      <span class="nachnewalaemoj" style="bottom: 5%; right: 10%; animation-duration:
      4s;">🥳</span>
      
      </div>
    <div class="floating-icons">
      <span class="icon" style="top: 10%; left: 20%; animation-duration:
      4s;">👻</span>
      <span class="icon" style="top: 10%; right: 10%; animation-duration:
      4s;">👻</span>
      <span class="icon" style="bottom: 10%; left: 10%; animation-duration:
      4s;">👻</span>
      <span class="icon" style="bottom: 10%; right: 10%; animation-duration:
      4s;">👻</span></div>

    <div class="card">
      <div class="ghem">👻</div>
      <h1>HAPPY BIRTHDAY!</h1>
      <p>Unseen support aur hamesha saath rehne wali vibes ke liye—Happy
      Birthday to the coolest Bro ever! 🥳✨</p>
      <button class="btn" onclick="alert('Bhoot ki taraf se Party Mubarak!
      🎂🥳')">Party De <strong>BSDK!</strong> 🍕</button>
    </div>

  </body>
</html>
