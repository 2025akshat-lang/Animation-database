<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crown Burger Exploded Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #fff;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 10px;
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-top: 15px;
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: #fff;
      font-weight: 700;
    }

    header p {
      color: #888;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .burger-container {
      position: relative;
      width: 280px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: auto 0;
    }

    /* Base layer setup */
    .layer {
      position: absolute;
      width: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Z-Index sequence for natural depth */
    .layer-1 { z-index: 8; } /* Sesame Bun (Top) */
    .layer-2 { z-index: 4; } /* Fresh Tomato */
    .layer-3 { z-index: 3; } /* Cheddar Cheese */
    .layer-4 { z-index: 2; } /* Smoky Patty */
    .layer-5 { z-index: 1; } /* Toasted Bun (Bottom) */

    .layer img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5));
    }

    /* Label styling */
    .label {
      position: absolute;
      white-space: nowrap;
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      color: #fff;
      display: flex;
      align-items: center;
    }

    .label.left { 
      right: 90%; 
      margin-right: 10px; 
    }

    .label.right { 
      left: 90%; 
      margin-left: 10px; 
    }

    .label.left::after {
      content: '';
      display: inline-block;
      width: 25px;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.5);
      margin-left: 8px;
    }

    .label.right::before {
      content: '';
      display: inline-block;
      width: 25px;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.5);
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>CROWN BURGER</h1>
    <p>Tap anywhere to reveal ingredients</p>
  </header>

  <div class="burger-container" id="burgerContainer">
    <div class="layer layer-1">
      <img src="bun-top.png" alt="Top Bun">
      <span class="label left">Sesame Bun</span>
    </div>
    <div class="layer layer-2">
      <img src="tomato.png" alt="Tomato">
      <span class="label right">Fresh Tomato</span>
    </div>
    <div class="layer layer-3">
      <img src="cheese.png" alt="Cheese">
      <span class="label left">Cheddar Cheese</span>
    </div>
    <div class="layer layer-4">
      <img src="patty.png" alt="Patty">
      <span class="label right">Smoky Patty</span>
    </div>
    <div class="layer layer-5">
      <img src="bun-bottom.png" alt="Bottom Bun">
      <span class="label left">Toasted Bun</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    const burgerContainer = document.getElementById('burgerContainer');
    let isExploded = false;

    // Initial offsets: Jab burger band rahega to proper fit lagega
    const closedOffsets = {
      '.layer-1': -28, // Top Bun
      '.layer-2': -12, // Tomato
      '.layer-3': -2,  // Cheese
      '.layer-4': 10,  // Patty
      '.layer-5': 25   // Bottom Bun
    };

    // Exploded offsets: Tap karne par door phail jayega
    const explodedOffsets = {
      '.layer-1': -135,
      '.layer-2': -68,
      '.layer-3': 0,
      '.layer-4': 68,
      '.layer-5': 135
    };

    // Page load hote hi burger ko proper assembled shape me set kar do
    Object.keys(closedOffsets).forEach(selector => {
      gsap.set(selector, { y: closedOffsets[selector] });
    });

    burgerContainer.addEventListener('click', () => {
      if (!isExploded) {
        // Open Animation (Explode)
        Object.keys(explodedOffsets).forEach(selector => {
          gsap.to(selector, { 
            y: explodedOffsets[selector], 
            duration: 0.6, 
            ease: "power3.out" 
          });
        });

        gsap.to('.label', { 
          opacity: 1, 
          duration: 0.3, 
          delay: 0.25 
        });

        isExploded = true;
      } else {
        // Close Animation (Assemble back)
        Object.keys(closedOffsets).forEach(selector => {
          gsap.to(selector, { 
            y: closedOffsets[selector], 
            duration: 0.5, 
            ease: "power3.inOut" 
          });
        });

        gsap.to('.label', { 
          opacity: 0, 
          duration: 0.2 
        });

        isExploded = false;
      }
    });
  </script>
</body>
</html>
