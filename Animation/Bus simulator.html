    // 1) Scene setup

    dirLight.position.set(8, 12, 6);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 3) Infinite Ground Mesh

    const groundMat = new THREE.MeshStandardMaterial({ color: 0x6ab04c });
    const ground = new THREE.Mesh(groundGeo, groundMat);

    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;

    for (let z = -140; z <= 140; z += 6) {
        const lineGeo = new THREE.BoxGeometry(0.25, 0.02, 3);
        const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

    //   -- 5) CHARACTER CREATION (UPDATED FOR LIMB ANIMATION)   --
    function createCharacter(shirtColor, pantColor, isGirl = false) {
        const group = new THREE.Group();

        // Head
        const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.35, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0xffdbac })
        );
        head.position.y = 2.4; head.castShadow = true; group.add(head);

        // Eyes
        const eyeGeo = new THREE.SphereGeometry(0.05, 8, 8);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat); leftEye.position.set(-0.1, 2.45, 0.3); group.add(leftEye);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat); rightEye.position.set(0.1, 2.45, 0.3); group.add(rightEye);

        // Mouth
        const mouthGeo = new THREE.RingGeometry(0.03, 0.08, 16, 1, 0, Math.PI);
        const mouthMat = new THREE.MeshStandardMaterial({ color: 0x000000, side: THREE.DoubleSide });
        const mouth = new THREE.Mesh(mouthGeo, mouthMat);
        mouth.position.set(0, 2.32, 0.32);
        mouth.rotation.x = Math.PI;
        group.add(mouth);

        // Hair
        const hair = new THREE.Mesh(
            new THREE.SphereGeometry(0.36, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: isGirl ? 0xff3366 : 0x111111 })
        );
        hair.position.set(0, 2.45, 0); group.add(hair);

        // Torso
        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(0.35, 0.25, 1.1, 16),
            new THREE.MeshStandardMaterial({ color: shirtColor })
        );
        body.position.y = 1.5; body.castShadow = true; group.add(body);

        // --- LEGS WITH PIVOTS ---
        const legGeo = new THREE.CylinderGeometry(0.1, 0.08, 0.9, 16);
        legGeo.translate(0, -0.45, 0); // Pivot at Hip
        const legMat = new THREE.MeshStandardMaterial({ color: pantColor });

        const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.2, 0.95, 0); leftLeg.castShadow = true;
        const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.2, 0.95, 0); rightLeg.castShadow = true;
        group.add(leftLeg, rightLeg);

        // --- ARMS WITH PIVOTS ---
        const armGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.9, 16);
        armGeo.translate(0, -0.45, 0); // Pivot at Shoulder
        const armMat = new THREE.MeshStandardMaterial({ color: shirtColor });

        const leftArm = new THREE.Mesh(armGeo, armMat); leftArm.position.set(-0.48, 2.05, 0); leftArm.castShadow = true;
        const rightArm = new THREE.Mesh(armGeo, armMat); rightArm.position.set(0.48, 2.05, 0); rightArm.castShadow = true;
        group.add(leftArm, rightArm);

        return {
            mesh: group,
            head: head,
            mouth: mouth,
            leftArm: leftArm,
            rightArm: rightArm,
            leftLeg: leftLeg,
            rightLeg: rightLeg
        };

    function animateTalking(character, text, durationMs = 3000) {
        if (isTalking || !character || !character.mouth) return;
        isTalking = true;

        if ('speechSynthesis' in window) {
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            } catch (err) {}
        }

        let startTime = Date.now();
        const interval = setInterval(() => {
            const elapsedTime = Date.now() - startTime;
            if (elapsedTime >= durationMs) {
                clearInterval(interval);
                character.mouth.scale.y = 1;
                isTalking = false;
                return;
            }
            character.mouth.scale.y = (Math.floor(elapsedTime / 120) % 2 === 0) ? 2.5 : 0.5;
        }, 50);
    }

//   -- MULTI-VEHICLE TRAFFIC SYNTHESIZER   --
let trafficAudioCtx = null;
let trafficActive = false;
let activeTimers = [];

// Vehicle profiles with unique frequencies and wave types
const VEHICLES = [
    {
        name: "Standard Car",
        freq1: 415, freq2: 475, // Medium pitch
        wave1: "sawtooth", wave2: "triangle",
        volume: 0.15,
        minDuration: 0.2, maxDuration: 0.5,
        minDelay: 1000, maxDelay: 3000
    },
    {
        name: "Heavy Truck / Bus",
        freq1: 180, freq2: 220, // Very deep and low pitch
        wave1: "sawtooth", wave2: "sawtooth",
        volume: 0.25,
        minDuration: 0.4, maxDuration: 0.8,
        minDelay: 2500, maxDelay: 6000
    },
    {
        name: "Scooter / Rickshaw",
        freq1: 650, freq2: 800, // High pitch, squeaky
        wave1: "triangle", wave2: "sine",
        volume: 0.10,
        minDuration: 0.1, maxDuration: 0.3,
        minDelay: 800, maxDelay: 2000
    },
    {
        name: "Angry Commuter",
        freq1: 440, freq2: 445, // Sharp, beating frequency
        wave1: "sawtooth", wave2: "square",
        volume: 0.18,
        minDuration: 0.6, maxDuration: 1.2,
        minDelay: 4000, maxDelay: 8000
    }
];

// Synthesize a horn based on a specific vehicle type
function triggerVehicleHonk(vehicle) {
    if (!trafficAudioCtx || !trafficActive) return;

    const osc1 = trafficAudioCtx.createOscillator();
    const osc2 = trafficAudioCtx.createOscillator();
    const hornGain = trafficAudioCtx.createGain();

    osc1.type = vehicle.wave1;
    osc2.type = vehicle.wave2;

    osc1.frequency.setValueAtTime(vehicle.freq1, trafficAudioCtx.currentTime);
    osc2.frequency.setValueAtTime(vehicle.freq2, trafficAudioCtx.currentTime);

    // Randomize duration based on vehicle limits
    const duration = vehicle.minDuration + Math.random() * (vehicle.maxDuration - vehicle.minDuration);
    const now = trafficAudioCtx.currentTime;

    // Volume Envelope
    hornGain.gain.setValueAtTime(0, now);
    hornGain.gain.linearRampToValueAtTime(vehicle.volume, now + 0.02); // Sharp burst
    hornGain.gain.setValueAtTime(vehicle.volume, now + duration - 0.04);
    hornGain.gain.linearRampToValueAtTime(0, now + duration); // Rapid fade out

    osc1.connect(hornGain);
    osc2.connect(hornGain);
    hornGain.connect(trafficAudioCtx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + duration);
    osc2.stop(now + duration);
}

// Start a unique, independent loop for each vehicle type
function startTrafficSimulation() {
    if (!trafficAudioCtx) {
        trafficAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (trafficAudioCtx.state === 'suspended') {
        trafficAudioCtx.resume();
    }

    trafficActive = true;
    activeTimers = [];

    VEHICLES.forEach((vehicle) => {
        function runVehicleLoop() {
            if (!trafficActive) return;

            // Trigger the honk
            triggerVehicleHonk(vehicle);

            // Schedule the next time this specific vehicle type honks
            const delay = vehicle.minDelay + Math.random() * (vehicle.maxDelay - vehicle.minDelay);
            const timer = setTimeout(runVehicleLoop, delay);
            activeTimers.push(timer);
        }

        // Add a small initial delay so they don't all honk on the exact split-second you click start
        const initialDelay = Math.random() * 1000;
        const startTimer = setTimeout(runVehicleLoop, initialDelay);
        activeTimers.push(startTimer);
    });
}

function stopTrafficSimulation() {
    trafficActive = false;
    activeTimers.forEach(timer => clearTimeout(timer));
    activeTimers = [];
}

// UI Button
const soundBtn = document.createElement('button');
soundBtn.innerText = '🎺 City Traffic: OFF';
soundBtn.style.cssText = 'position:fixed; top:135px; right:15px; padding:6px 12px; background:rgba(0,0,0,0.85); color:white; border:2px solid #f44336; border-radius:12px; font-weight:bold; font-size:11px; cursor:pointer; z-index:999;';

});
document.body.appendChild(walkBtn);


    createActionButton('💍 Shaadi Scene', '#ffb703', () => {
        // Shaadi pose setup: Dono ek doosre ke paas aayenge
        boy.mesh.position.set(-0.5, 0, activeCharacter.mesh.position.z);

    });

    // 7) Trees
    const trees = [];
    function createTree(x, z) {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.25, 1.5, 12),

        tree.position.set(x, 0, z);

    //   -- Coins & Boosters System   --

    const coins = [];

    const camBtn  = makeBtn('CAM: AUTO');

    //   -- Camera Touch Controls   --
    // FIX 1: Starting me autoCam ko false kar diya taaki manual rahe
    let yaw = 0, pitch = 0.4, camDist = 10, autoCam = false, isTouching = false, lastX = 0, lastY = 0, pinchStartDist = null;

    renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) { 
            isTouching = true; 
            lastX = e.touches[0].clientX; 
            lastY = e.touches[0].clientY; 
        } else if (e.touches.length === 2) { 
            const a = e.touches[0], b = e.touches[1]; 
            pinchStartDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); 
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isTouching && !autoCam) {
            const x = e.touches[0].clientX, y = e.touches[0].clientY;
            yaw -= (x - lastX) * 0.005; 
            pitch -= (y - lastY) * 0.003;
            pitch = Math.max(0.12, Math.min(1.1, pitch));
            lastX = x; 
            lastY = y;
        } else if (e.touches.length === 2 && pinchStartDist) {
            // FIX 2: Incomplete pinch logic fix
            const a = e.touches[0], b = e.touches[1];
            const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            const delta = pinchStartDist - dist;
            camDist = Math.max(4, Math.min(25, camDist + delta * 0.02)); // Zoom in/out limit
            pinchStartDist = dist;
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) pinchStartDist = null;
        if (e.touches.length === 0) isTouching = false;
    });

function setJoy(clientX, clientY) {
    const rect = joyBase.getBoundingClientRect();
    let dx = clientX - (rect.left + rect.width / 2);
    let dy = clientY - (rect.top + rect.height / 2);
    const max = 35, len = Math.hypot(dx, dy);
    if (len > max) { dx = (dx / len) * max; dy = (dy / len) * max; }
    joyKnob.style.left = (35 + dx) + 'px'; joyKnob.style.top = (35 + dy) + 'px';
    joy.x = -dx / max; joy.y = -dy / max;
}
function resetJoy() { joyKnob.style.left = '35px'; joyKnob.style.top = '35px'; joy.x = 0; joy.y = 0; }

joyBase.addEventListener('pointerdown', (e) => { joyActive = true; joyPointerId = e.pointerId; joyBase.setPointerCapture(e.pointerId); setJoy(e.clientX, e.clientY); e.stopPropagation(); });
joyBase.addEventListener('pointermove', (e) => { if (!joyActive || e.pointerId !== joyPointerId) return; setJoy(e.clientX, e.clientY); });
function endJoy(e) { if (e.pointerId !== joyPointerId) return; joyActive = false; joyPointerId = null; resetJoy(); }
joyBase.addEventListener('pointerup', endJoy); joyBase.addEventListener('pointercancel', endJoy);



    //   -- Vehicles   --
    function wheel(x, y, z) {
        const w = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.18, 14), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        w.rotation.z = Math.PI / 2; w.position.set(x, y, z); return w;
    }

    const car = createCar(0xe63946);
    const bus = createBus(0xffb703);
    const truck = createTruck();
    car.position.set(-1.8, 0, 15); bus.position.set(1.8, 0, -20); truck.position.set(-1.8, 0, -45);
    scene.add(car, bus, truck);

    function createCar(color) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 1.8), new THREE.MeshStandardMaterial({ color }));
        body.position.y = 0.45; g.add(body);
        const top = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.35, 0.9), new THREE.MeshStandardMaterial({ color: 0xd9d9d9 }));
        top.position.set(0, 0.8, -0.15); g.add(top);
        g.add(wheel(0.45, 0.2, 0.5), wheel(-0.45, 0.2, 0.5), wheel(0.45, 0.2, -0.5), wheel(-0.45, 0.2, -0.5));
        return g;
    }
    function createBus(color) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.1, 3.2), new THREE.MeshStandardMaterial({ color }));
        body.position.y = 0.7; g.add(body);
        g.add(wheel(0.65, 0.25, 1.1), wheel(-0.65, 0.25, 1.1), wheel(0.65, 0.25, -1.1), wheel(-0.65, 0.25, -1.1));
        return g;
    }
    function createTruck() {
        const g = new THREE.Group();
        const back = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 2.4), new THREE.MeshStandardMaterial({ color: 0x4cc9f0 }));
        back.position.set(0, 0.75, -0.4); g.add(back);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.9, 1.0), new THREE.MeshStandardMaterial({ color: 0xef476f }));
        cabin.position.set(0, 0.6, 1.1); g.add(cabin);
        g.add(wheel(0.65, 0.25, 1.2), wheel(-0.65, 0.25, 1.2), wheel(0.65, 0.25, 0.2), wheel(-0.65, 0.25, 0.2), wheel(0.65, 0.25, -1.0), wheel(-0.65, 0.25, -1.0));
        return g;
    }
    function spinVehicleWheels(v, s) {
        v.children.forEach(p => { if (p.geometry && p.geometry.type === 'CylinderGeometry') p.rotation.z -= s; });
    }

    //   -- Animation Loop   --
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        //   -- ANIMATION LOOP CONTROL   --
if (joyActive && (joy.x !== 0 || joy.y !== 0)) {
    if (isRotationOnly) {
        // MODE 1: ROTATION ON -> Joystick se bas character turn hoga
        const targetAngle = Math.atan2(joy.x, -joy.y);
        activeCharacter.mesh.rotation.y = targetAngle;
    } else {
        // MODE 2: ROTATION OFF -> Joystick se Aage/Piche/Daaye/Baaye chalega
        const speed = 0.12;
        
        // World coordinates me move karna
        activeCharacter.mesh.position.x += joy.x * speed;
        activeCharacter.mesh.position.z += joy.y * speed;

        // Face Movement Direction (Automatically jis taraf chal raha hai udhar face karega)
        activeCharacter.mesh.rotation.y = Math.atan2(joy.x, joy.y);
    }
}


        // Handle Boost Timer
        if (boostTimer > 0) {
            boostTimer -= 0.016;
            if (boostTimer <= 0) speedMultiplier = 1;
        }

        //   -- LIMB ANIMATIONS (WALKING, DANCE & IDLE)   --
        const isMoving = joy.x !== 0 || joy.y !== 0;

        function animateLimbs(char, timeOffset = 0) {
            if (typeof isDancing !== 'undefined' && isDancing) {
                // 💃 Dance Animations (Hands, Legs & Head Masti)
                char.leftArm.rotation.x = Math.sin(t * 8 + timeOffset) * 1.2;
                char.rightArm.rotation.x = -Math.sin(t * 8 + timeOffset) * 1.2;
                char.leftArm.rotation.z = Math.cos(t * 6) * 0.8;
                char.rightArm.rotation.z = -Math.cos(t * 6) * 0.8;
                
                char.leftLeg.rotation.x = Math.sin(t * 10) * 0.4;
                char.rightLeg.rotation.x = -Math.sin(t * 10) * 0.4;
                if (char.head) char.head.rotation.y = Math.sin(t * 5) * 0.3;
            } else if (isMoving && activeCharacter === char) {
                // Normal Walking
                const swing = Math.sin(t * 10 + timeOffset) * 0.6;
                char.leftArm.rotation.x = swing;
                char.rightArm.rotation.x = -swing;
                char.leftArm.rotation.z = 0;
                char.rightArm.rotation.z = 0;
                char.leftLeg.rotation.x = -swing;
                char.rightLeg.rotation.x = swing;
                if (char.head) char.head.rotation.y = 0;
            } else {
                // Idle Pose (Smooth Reset)
                char.leftArm.rotation.x *= 0.8;
                char.rightArm.rotation.x *= 0.8;
                char.leftArm.rotation.z *= 0.8;
                char.rightArm.rotation.z *= 0.8;
                char.leftLeg.rotation.x *= 0.8;
                char.rightLeg.rotation.x *= 0.8;
                if (char.head) char.head.rotation.y *= 0.8;
            }
        }

        // Both characters bobbing & limb swing
        boy.mesh.position.y = Math.sin(t * 2) * 0.05;
        girl.mesh.position.y = Math.sin(t * 2 + 1) * 0.05;

        animateLimbs(boy, 0);
        animateLimbs(girl, Math.PI);


        //   -- INDEPENDENT JOYSTICK MOVEMENT   --
//   -- SMOOTH CHARACTER MOVEMENT & ROTATION   --
if (activeCharacter && (joy.x !== 0 || joy.y !== 0)) {
    // 1. Target angle calculate karo
    const targetAngle = Math.atan2(-joy.x, joy.y);
    
    // 2. Shortest rotation path determine karo
    let diff = targetAngle - activeCharacter.mesh.rotation.y;
    while (diff < -Math.PI) diff += Math.PI * 2;
    while (diff > Math.PI) diff -= Math.PI * 2;
    
    // 3. Smooth Turning (0.15 value speed control karegi)
    activeCharacter.mesh.rotation.y += diff * 0.5;
    
    // 4. Movement apply karo
    activeCharacter.mesh.position.x += joy.x * 0.05 * speedMultiplier;
    activeCharacter.mesh.position.z -= joy.y * 0.05 * speedMultiplier;
}
// ... animate function ke andar joystick logic ...

if (joyActive && (joy.x !== 0 || joy.y !== 0)) {
    const speed = 0.12;

    if (isWalkingTogether) {
        // Dono ko ek saath move karo
        const moveX = joy.x * speed;
        const moveZ = joy.y * speed;

        // Boy move
        boy.mesh.position.x += moveX;
        boy.mesh.position.z += moveZ;
        boy.mesh.rotation.y = Math.atan2(joy.x, joy.y);

        // Girl position sync (Boy ke saath-saath)
        girl.mesh.position.x = boy.mesh.position.x + 0.8;
        girl.mesh.position.z = boy.mesh.position.z;
        girl.mesh.rotation.y = boy.mesh.rotation.y;

    } else if (isRotationOnly) {
        // Sirf Rotation Mode
        const targetAngle = Math.atan2(joy.x, -joy.y);
        activeCharacter.mesh.rotation.y = targetAngle;
    } else {
        // Normal Move Mode
        activeCharacter.mesh.position.x += joy.x * speed;
        activeCharacter.mesh.position.z += joy.y * speed;
        activeCharacter.mesh.rotation.y = Math.atan2(joy.x, joy.y);
    }
}





        // Infinite World Scrolling (Tracks active character)
        ground.position.set(activeCharacter.mesh.position.x, 0, activeCharacter.mesh.position.z);
        road.position.z = activeCharacter.mesh.position.z;

        roadLines.forEach(l => {
            if (l.position.z > activeCharacter.mesh.position.z + 70) l.position.z -= 140;
            if (l.position.z < activeCharacter.mesh.position.z - 70) l.position.z += 140;
        });

        trees.forEach(tr => {
            if (tr.position.z > activeCharacter.mesh.position.z + 120) tr.position.z -= 240;
            if (tr.position.z < activeCharacter.mesh.position.z - 120) tr.position.z += 240;
        });

        // Vehicles movement
        [car, bus, truck].forEach((v, idx) => {
            v.position.z -= (0.18 - idx * 0.03);
            if (v.position.z < activeCharacter.mesh.position.z - 60) v.position.z = activeCharacter.mesh.position.z + 60;
            spinVehicleWheels(v, 0.2);
        });

        // Clouds movement
        clouds.forEach((c, i) => {
            c.position.x += 0.005 + i * 0.001;
            if (c.position.x > activeCharacter.mesh.position.x + 30) c.position.x = activeCharacter.mesh.position.x - 30;
        });

        // Camera follow
        const targetX = (boy.mesh.position.x + girl.mesh.position.x) * 0.5;
        const targetZ = (boy.mesh.position.z + girl.mesh.position.z) * 0.5;
        if (autoCam) yaw += 0.002;

        const target = new THREE.Vector3(targetX, 1.8, targetZ);
        camera.position.x = target.x + Math.sin(yaw) * Math.cos(pitch) * camDist;
        camera.position.z = target.z + Math.cos(yaw) * Math.cos(pitch) * camDist;
        camera.position.y = target.y + Math.sin(pitch) * camDist * 0.8;
        camera.lookAt(target);

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
