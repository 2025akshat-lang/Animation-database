<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Mela Carousel Physics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-top: 10px;
            font-size: 1.3rem;
            color: #facc15;
            text-align: center;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
            text-align: center;
        }
        .controls {
            margin-bottom: 10px;
        }
        .sound-btn {
            background: #22c55e;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
            transition: all 0.2s ease;
        }
        .sound-btn.off {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }
        canvas {
            background: #0f172a;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            max-width: 95vw;
            max-height: 70vh;
        }
    </style>
</head>
<body>

    <h1>🎠 Carousel Circular Motion & Oscillation 🎡</h1>
    <p> Made by Akshat</p>

    <div class="controls">
        <button id="soundBtn" class="sound-btn off">🔊 Tap to Start High-Volume Mela Sound</button>
    </div>

    <canvas id="carouselCanvas" width="400" height="520"></canvas>

    <script>
        const canvas = document.getElementById('carouselCanvas');
        const ctx = canvas.getContext('2d');

        const centerX = canvas.width / 2;
        const centerY = 330; 
        const roofBaseY = 175;
        const radiusX = 130; 
        const radiusY = 38;  
        const numHorses = 6;
        
        let angleOffset = 0;

        const palette = ['#e11d48', '#2563eb', '#059669', '#d97706', '#7c3aed', '#db2777', '#0284c7', '#16a34a', '#ca8a04', '#9333ea', '#ea580c', '#0891b2'];
        const kidColors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

        // --- ENHANCED HIGH-VOLUME AUDIO SYNTHESIZER ---
        let audioCtx = null;
        let isAudioPlaying = false;
        let musicInterval = null;
        let noiseNode = null;

        const soundBtn = document.getElementById('soundBtn');

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Louder Ambient Mela Background Noise
        function startMelaNoise() {
            if (!audioCtx) return;

            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(500, audioCtx.currentTime);
            filter.Q.setValueAtTime(1.2, audioCtx.currentTime);

            // --- VOLUME BOOSTED FOR NOISE ---
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.12, audioCtx.currentTime); 

            noiseNode.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            noiseNode.start();
        }

        // Louder Mela Organ Music
        function playCarnivalMusic() {
            const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 392.00, 329.63]; 
            let step = 0;

            musicInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx) return;

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();

                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);

                // --- VOLUME BOOSTED FOR MUSIC ---
                gain.gain.setValueAtTime(0.30, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.23);

                step++;
            }, 260);
        }

        soundBtn.addEventListener('click', () => {
            initAudio();
            
            isAudioPlaying = !isAudioPlaying;

            if (isAudioPlaying) {
                soundBtn.innerText = "🔇 Stop Mela Sound";
                soundBtn.classList.remove('off');
                startMelaNoise();
                playCarnivalMusic();
            } else {
                soundBtn.innerText = "🔊 Tap to Start High-Volume Mela Sound";
                soundBtn.classList.add('off');
                if (musicInterval) clearInterval(musicInterval);
                if (noiseNode) {
                    try { noiseNode.stop(); } catch(e){}
                }
            }
        });

        // --- FLOATING BALLOONS EFFECT ---
        let balloons = [];
        for (let b = 0; b < 8; b++) {
            balloons.push({
                x: Math.random() * canvas.width,
                y: canvas.height + Math.random() * 200,
                radius: 8 + Math.random() * 6,
                speed: 0.5 + Math.random() * 0.8,
                color: palette[b % palette.length]
            });
        }

        function drawFloatingBalloons() {
            balloons.forEach(b => {
                b.y -= b.speed;
                if (b.y < -20) {
                    b.y = canvas.height + 20;
                    b.x = Math.random() * canvas.width;
                }

                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.ellipse(b.x, b.y, b.radius, b.radius * 1.2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + b.radius * 1.2);
                ctx.lineTo(b.x + Math.sin(b.y * 0.05) * 5, b.y + b.radius * 1.2 + 15);
                ctx.stroke();
            });
        }

        // --- BACKGROUND GRAPHICS ---
        function drawMelaBackground(time) {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#090d16');
            skyGrad.addColorStop(0.7, '#1e1b4b');
            skyGrad.addColorStop(1, '#311042');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawFloatingBalloons();

            ctx.fillStyle = '#1e1b4b';
            ctx.beginPath();
            ctx.moveTo(0, 420);
            ctx.lineTo(40, 380); ctx.lineTo(80, 420);
            ctx.lineTo(120, 390); ctx.lineTo(160, 420);
            ctx.lineTo(240, 370); ctx.lineTo(300, 420);
            ctx.lineTo(350, 385); ctx.lineTo(400, 420);
            ctx.lineTo(400, 520); ctx.lineTo(0, 520);
            ctx.closePath();
            ctx.fill();

            for (let x = 30; x < 400; x += 70) {
                ctx.fillStyle = (Math.floor(time * 4 + x) % 2 === 0) ? '#fde047' : '#f43f5e';
                ctx.beginPath();
                ctx.arc(x, 400, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }

            const fwX = 60;
            const fwY = 160;
            const fwRadius = 45;

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(fwX, fwY); ctx.lineTo(fwX - 25, fwY + 70);
            ctx.moveTo(fwX, fwY); ctx.lineTo(fwX + 25, fwY + 70);
            ctx.stroke();

            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(fwX, fwY, fwRadius, 0, Math.PI * 2);
            ctx.stroke();

            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                let rotAngle = a + time * 0.6;
                let lx = fwX + Math.cos(rotAngle) * fwRadius;
                let ly = fwY + Math.sin(rotAngle) * fwRadius;
                
                ctx.beginPath();
                ctx.moveTo(fwX, fwY);
                ctx.lineTo(lx, ly);
                ctx.stroke();

                ctx.fillStyle = (Math.floor(time * 6 + a) % 2 === 0) ? '#f43f5e' : '#38bdf8';
                ctx.fillRect(lx - 3.5, ly - 3.5, 7, 7);
            }

            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.quadraticCurveTo(100, 40, 200, 15);
            ctx.quadraticCurveTo(300, 40, 400, 10);
            ctx.stroke();

            const bulbColors = ['#f43f5e', '#facc15', '#22c55e', '#38bdf8', '#a855f7'];
            for (let i = 0; i <= 20; i++) {
                let bx = i * 20;
                let by = 15 + Math.sin(i * 0.5) * 12;
                let color = bulbColors[(i + Math.floor(time * 8)) % bulbColors.length];
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(bx, by, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawRotatingCanopy(angle) {
            const topY = 90;
            const segments = 12;

            ctx.beginPath();
            ctx.moveTo(centerX, topY - 15);
            ctx.lineTo(centerX, topY - 48);
            ctx.quadraticCurveTo(centerX + 15, topY - 40, centerX + 28, topY - 48);
            ctx.quadraticCurveTo(centerX + 15, topY - 30, centerX, topY - 32);
            ctx.closePath();
            ctx.fillStyle = '#dc2626';
            ctx.fill();

            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX, topY - 15);
            ctx.lineTo(centerX, topY - 50);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(centerX, topY - 15);
            ctx.lineTo(centerX - 32, topY + 20);
            ctx.lineTo(centerX + 32, topY + 20);
            ctx.closePath();
            ctx.fillStyle = '#f59e0b';
            ctx.fill();

            for (let i = 0; i < segments; i++) {
                let segAngle1 = angle + (i * (Math.PI * 2 / segments));
                let segAngle2 = angle + ((i + 1) * (Math.PI * 2 / segments));

                let x1 = centerX + Math.cos(segAngle1) * (radiusX + 18);
                let y1 = roofBaseY + Math.sin(segAngle1) * radiusY;
                let x2 = centerX + Math.cos(segAngle2) * (radiusX + 18);
                let y2 = roofBaseY + Math.sin(segAngle2) * radiusY;

                ctx.beginPath();
                ctx.moveTo(centerX, topY + 15);
                ctx.lineTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.closePath();

                ctx.fillStyle = palette[i % palette.length];
                ctx.fill();
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.ellipse(centerX, roofBaseY + 6, radiusX + 18, radiusY + 4, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#581c87';
            ctx.fill();
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawBasePlatform() {
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 20, radiusX + 15, radiusY + 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#090d16';
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 10, radiusX + 8, radiusY + 4, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#c2410c';
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#0284c7';
            ctx.fill();
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawCenterPillar() {
            const pillarWidth = 32;
            const pillarTopY = roofBaseY + 6;
            const pillarBottomY = centerY; 

            ctx.fillStyle = '#15803d';
            ctx.fillRect(centerX - pillarWidth / 2, pillarTopY, pillarWidth, pillarBottomY - pillarTopY);

            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 4;
            for (let y = pillarTopY; y < pillarBottomY; y += 18) {
                let shiftY = y + ((angleOffset * 22) % 16);
                if (shiftY >= pillarTopY && shiftY <= pillarBottomY - 4) {
                    ctx.beginPath();
                    ctx.moveTo(centerX - pillarWidth / 2, shiftY);
                    ctx.lineTo(centerX + pillarWidth / 2, shiftY + 8);
                    ctx.stroke();
                }
            }
        }

        function drawHorseWithRider(item, index) {
            ctx.save();
            
            let roofAttachX = item.x;
            let roofAttachY = roofBaseY + Math.sin(item.angle) * radiusY + 6;
            let baseAttachX = item.x;
            let baseAttachY = centerY + Math.sin(item.angle) * radiusY;

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3 * item.scale;
            ctx.beginPath();
            ctx.moveTo(roofAttachX, roofAttachY);
            ctx.lineTo(baseAttachX, baseAttachY);
            ctx.stroke();

            ctx.translate(item.x, item.y);
            ctx.scale(item.scale, item.scale);

            ctx.fillStyle = '#d97706';
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(11, -4);
            ctx.lineTo(20, -22);
            ctx.lineTo(26, -17);
            ctx.lineTo(17, 3);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(11, 8); ctx.lineTo(16, 22);
            ctx.moveTo(7, 8);  ctx.lineTo(10, 22);
            ctx.moveTo(-11, 8); ctx.lineTo(-16, 22);
            ctx.moveTo(-7, 8);  ctx.lineTo(-10, 22);
            ctx.stroke();

            ctx.fillStyle = '#dc2626';
            ctx.fillRect(-8, -12, 16, 8);

            let kidColor = kidColors[index % kidColors.length];
            ctx.fillStyle = kidColor;
            ctx.beginPath();
            ctx.ellipse(0, -18, 7, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fed7aa';
            ctx.beginPath();
            ctx.arc(3, -31, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#451a03';
            if (index % 2 === 0) {
                ctx.beginPath();
                ctx.arc(3, -32, 7, Math.PI * 0.8, Math.PI * 2.2);
                ctx.fill();
                ctx.fillRect(-3, -32, 4, 10);
                ctx.fillRect(5, -32, 4, 10);
            } else {
                ctx.beginPath();
                ctx.arc(3, -33, 6, Math.PI, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = '#fed7aa';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(2, -20);
            ctx.lineTo(0, -15);
            ctx.stroke();

            ctx.restore();
        }

        function animate(timestamp) {
            let time = timestamp ? timestamp / 1000 : 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawMelaBackground(time);

            let items = [];
            for (let i = 0; i < numHorses; i++) {
                let angle = angleOffset + (i * (Math.PI * 2 / numHorses));
                
                let x = centerX + Math.cos(angle) * radiusX;
                let baseY = centerY + Math.sin(angle) * radiusY;

                let verticalOffset = Math.sin(angleOffset * 4 + i) * 10;
                let scale = 0.7 + (baseY - (centerY - radiusY)) / (radiusY * 2) * 0.4;

                items.push({
                    x: x,
                    y: baseY - 20 + verticalOffset,
                    baseY: baseY,
                    scale: scale,
                    angle: angle,
                    index: i
                });
            }

            let backItems = items.filter(item => item.baseY < centerY);
            let frontItems = items.filter(item => item.baseY >= centerY);

            backItems.sort((a, b) => a.baseY - b.baseY);
            frontItems.sort((a, b) => a.baseY - b.baseY);

            drawRotatingCanopy(angleOffset);
            backItems.forEach(item => drawHorseWithRider(item, item.index));
            
            drawBasePlatform();
            drawCenterPillar();

            frontItems.forEach(item => drawHorseWithRider(item, item.index));

            angleOffset += 0.015;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
