<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Interactive Magic Swarm</title>
    <style>
        /* पूरी स्क्रीन को डार्क और नो-स्क्रॉल बनाना */
        body {
            margin: 0;
            padding: 0;
            background-color: #020208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* कैनवास जो पूरे बैकग्राउंड को कवर करेगा */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* ऑन-स्क्रीन टेक्स्ट गाइड */
        .ui-overlay {
            position: absolute;
            pointer-events: none; /* ताकि टच/क्लिक कैनवास पर ही हो */
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        .ui-overlay h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            animation: pulse 2s infinite alternate;
        }

        .ui-overlay p {
            font-size: 14px;
            color: #888;
            margin: 0;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <!-- यूज़र इंटरफ़ेस -->
    <div class="ui-overlay">
        <h1>Magic Particles ⚡</h1>
        <p>उंगली घुमाएं और ब्लास्ट के लिए CLICK करें!</p>
    </div>

    <!-- HTML5 Canvas जहाँ असली कोडिंग का जादू चलेगा -->
    <canvas id="magicCanvas"></canvas>

    <script>
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');

        // स्क्रीन साइज के हिसाब से कैनवास को सेट करना
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // माउस/टच की पोजीशन को ट्रैक करने के लिए ऑब्जेक्ट
        const pointer = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            active: false
        };

        const particles = [];
        const maxParticles = 120; // कस्टमाइज़ करने के लिए संख्या बदल सकते हैं

        // पार्टिकल क्लास (ब्लूप्रिंट)
        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x;
                this.y = y;
                this.isExplosion = isExplosion;
                
                // रैंडम नियॉन कलर्स (Cyan, Pink, Purple, Yellow, Green)
                const colors = ['#00f2fe', '#4facfe', '#ff007f', '#ff758c', '#00ff87', '#f9d423'];
                this.color = colors[Math.floor(Math.random() * colors.length)];

                if (this.isExplosion) {
                    // ब्लास्ट होने पर पार्टिकल चारों तरफ तेजी से भागेंगे
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 4;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.size = Math.random() * 5 + 3;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.015;
                } else {
                    // नॉर्मल तैरते हुए पार्टिकल्स की स्पीड
                    this.vx = Math.random() * 2 - 1;
                    this.vy = Math.random() * 2 - 1;
                    this.size = Math.random() * 4 + 2;
                }
            }

            update() {
                if (this.isExplosion) {
                    // ब्लास्ट लॉजिक
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= this.decay; // धीरे-धीरे गायब होंगे
                } else {
                    // चुंबक (Attraction) लॉजिक: माउस/टच की तरफ खिंचे चले आना
                    let dx = pointer.x - this.x;
                    let dy = pointer.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 300) {
                        // अगर माउस पास है तो उसकी तरफ तेजी से मुड़ो
                        this.vx += (dx / distance) * 0.2;
                        this.vy += (dy / distance) * 0.2;
                    }

                    // स्पीड लिमिटर ताकि पार्टिकल्स स्क्रीन से बाहर न भागें
                    this.vx *= 0.95;
                    this.vy *= 0.95;

                    this.x += this.vx;
                    this.y += this.vy;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.isExplosion ? this.alpha : 0.8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // ग्लो इफेक्ट (Neon Glow)
                ctx.shadowBlur = this.size * 3;
                ctx.shadowColor = this.color;
                
                ctx.fill();
                ctx.restore();
            }
        }

        // शुरुआत में स्क्रीन पर नॉर्मल पार्टिकल्स बनाना
        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height));
        }

        // एनीमेशन लूप (लगातार चलने वाला फंक्शन)
        function animate() {
            // ट्रेल इफ़ेक्ट (Motion Blur) के लिए हलका सा ट्रांसपेरेंट ब्लैक पेंट करना
            ctx.fillStyle = 'rgba(2, 2, 8, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                // अगर ब्लास्ट वाला पार्टिकल पूरी तरह गायब हो जाए तो उसे एरे से हटा दें
                if (particles[i].isExplosion && particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // --- इवेंट लिस्टनर्स (माउस और टच कंट्रोल) ---

        // माउस मूव करने पर
        window.addEventListener('mousemove', (e) => {
            pointer.x = e.clientX;
            pointer.y = e.clientY;
        });

        // मोबाइल टच करने पर
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                pointer.x = e.touches[0].clientX;
                pointer.y = e.touches[0].clientY;
            }
        });

        // क्लिक/टैप करने पर धमाका (Explosion)
        function createExplosion(x, y) {
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(x, y, true));
            }
        }

        window.addEventListener('click', (e) => {
            createExplosion(e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0) {
                createExplosion(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        // एनीमेशन शुरू करें
        animate();
    </script>
</body>
</html>
